name: Deploy ledger to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          app=family-ledger-transfer-20261113-140806
          mkdir -p _site
          cp "$app"/{index.html,style.css,app.js,browser-ledger.js} _site/
          sed -i 's/<html lang="zh-Hant">/<html lang="zh-Hant" data-ledger-mode="browser">/' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          public_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          if [[ "${PAGE_URL%/}/" != "$public_url" ]]; then
            echo "::error::GitHub deployed to $PAGE_URL instead of $public_url"
            exit 1
          fi

          check_page() {
            local url="$1" expected="$2" actual="$RUNNER_TEMP/pages-check"
            curl --fail --silent --show-error \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 \
              --write-out '%{http_code} %{url_effective}\n' "$url" --output "$actual"
            if [[ "$expected" == "landing" ]]; then
              grep -Fq '<title>家庭記帳手冊</title>' "$actual"
            else
              cmp "_site/$expected" "$actual"
            fi
          }

          for file in index.html app.js style.css browser-ledger.js; do
            check_page "$public_url$file?v=$GITHUB_SHA" "$file"
          done
          check_page "$public_url" landing
          check_page "${public_url}?v=${GITHUB_SHA:0:7}" index.html
          printf 'Public homepage: %s\n\nDirect HTML: %sindex.html?v=%s\n' \
            "$public_url" "$public_url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
