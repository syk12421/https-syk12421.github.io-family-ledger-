name: Deploy ledger to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
        with:
          source: .
          destination: ./_site
      - name: Stage public files
        run: |
          mkdir -p _publish
          cp _site/{index.html,style.css,app.js,browser-ledger.js} _publish/
          test ! -e _site/family-ledger-transfer-20261113-140806
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _publish
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          public_url="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          if [[ "${PAGE_URL%/}/" != "$public_url" ]]; then
            echo "::error::GitHub deployed to $PAGE_URL instead of $public_url"
            exit 1
          fi

          check_page() {
            local url="$1" expected="$2" actual="$RUNNER_TEMP/pages-check"
            curl --fail --silent --show-error \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 \
              --write-out '%{http_code} %{url_effective}\n' "$url" --output "$actual"
            if [[ "$expected" == "landing" ]]; then
              grep -Fq '<title>家庭記帳手冊</title>' "$actual"
            else
              cmp "_publish/$expected" "$actual"
            fi
          }

          for file in index.html app.js style.css browser-ledger.js; do
            check_page "$public_url$file?v=$GITHUB_SHA" "$file"
          done
          check_page "$public_url" landing
          check_page "${public_url}?v=${GITHUB_SHA:0:7}" index.html
          private_path=family-ledger-transfer-20261113-140806/data/ledger.sqlite
          status=$(curl --head --silent --show-error --max-time 15 --output /dev/null \
            --write-out '%{http_code}' "$public_url$private_path?v=$GITHUB_SHA")
          if [[ "$status" != 404 ]]; then
            echo "::error::The SQLite path returned HTTP $status instead of 404"
            exit 1
          fi
          printf 'Public homepage: %s\n\nDirect ledger: %sindex.html?v=%s\n' \
            "$public_url" "$public_url" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Open the public ledger in Chrome
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          google-chrome --headless --no-sandbox --disable-dev-shm-usage \
            --user-data-dir="$RUNNER_TEMP/pages-chrome" --remote-debugging-port=9222 about:blank &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT
          timeout 35s node .github/scripts/verify-pages.mjs 9222 "${PAGE_URL%/}/index.html?v=$GITHUB_SHA"
