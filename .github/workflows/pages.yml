name: Deploy ledger to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          app=family-ledger-transfer-20261113-140806
          mkdir -p _site
          cp "$app"/{index.html,style.css,app.js,browser-ledger.js} _site/
          sed -i 's/<html lang="zh-Hant">/<html lang="zh-Hant" data-ledger-mode="browser">/' _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify public site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          for path in "" app.js style.css browser-ledger.js; do
            file="${path:-index.html}"
            url="${PAGE_URL%/}/$path?v=$GITHUB_SHA"
            curl --fail --silent --show-error --location \
              --retry 6 --retry-all-errors --retry-delay 5 --max-time 15 \
              "$url" --output "$RUNNER_TEMP/ledger-$file"
            cmp "_site/$file" "$RUNNER_TEMP/ledger-$file"
            echo "Verified $file"
          done
